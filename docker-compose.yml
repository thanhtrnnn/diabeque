# Mặc định chỉ chạy Neo4j (cho cách chạy local bằng Makefile).
# Toàn bộ hệ thống trong Docker: docker compose --profile full up -d --build
name: diabeque

x-api-env: &api-env
  OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  MODEL_NAME: ${MODEL_NAME}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kb_diabet_a8}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}

services:
  neo4j:
    image: neo4j:5  # bản đã kiểm: 5.26
    ports:
      - "27474:7474"
      - "27687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-kb_diabet_a8}"
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Nạp neo4j/neo4j.dump vào volume (Neo4j phải đang tắt): make kb-restore
  neo4j-restore:
    image: neo4j:5  # bản đã kiểm: 5.26
    profiles: ["tools"]
    volumes:
      - neo4j_data:/data
      - ./neo4j:/backups:ro
    command: neo4j-admin database load neo4j --from-path=/backups --overwrite-destination=true

  rag-api:
    profiles: ["full"]
    build: { context: ., dockerfile: docker/api.Dockerfile, args: { APP: chap5-rag } }
    environment: { <<: *api-env, PORT: "8100" }
    ports: ["8100:8100"]
    volumes: [hf_cache:/hf]
    depends_on: { neo4j: { condition: service_healthy } }

  rag-web:
    profiles: ["full"]
    build: chap5-rag/frontend
    environment: { API_BASE_URL: http://rag-api:8100/api/v1 }
    ports: ["3100:3000"]
    depends_on: [rag-api]

  agents-api:
    profiles: ["full"]
    build: { context: ., dockerfile: docker/api.Dockerfile, args: { APP: chap6-agents } }
    environment: { <<: *api-env, PORT: "8200" }
    ports: ["8200:8200"]
    volumes: [hf_cache:/hf]
    depends_on: { neo4j: { condition: service_healthy } }

  agents-web:
    profiles: ["full"]
    build: chap6-agents/frontend
    environment: { API_BASE_URL: http://agents-api:8200/api/v1 }
    ports: ["3200:3000"]
    depends_on: [agents-api]

volumes:
  neo4j_data:
  hf_cache:
